[project]
name = "yonder"
version = "0.1.0"
description = "Vibey personal travel planner — Escape/Detour modes, multi-provider fare signals, vibes, passport map, and saved itineraries"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "rich>=13.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "segno>=1.6",
]

[project.scripts]
yonder = "yonder.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yonder*"]
